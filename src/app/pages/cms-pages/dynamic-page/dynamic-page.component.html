<ng-container *ngIf="!isLoading">
  <ng-container *ngIf="content || isPreviewing; else notFound">
    <builder-content
      [model]="model"
      [content]="content"
      [apiKey]="apiKey"
      [customComponents]="customComponents"
    ></builder-content>
  </ng-container>

  <ng-template #notFound>
    <div>
      <h2>404 - Content not found</h2>
      <p>URL Path: {{ currentUrlPath }}</p>
      <p>Model: {{ model }}</p>
    </div>
  </ng-template>
</ng-container>

</div>
