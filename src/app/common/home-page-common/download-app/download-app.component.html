
<section class="section-downloadApp">
    <div class="container">
        <div class="downloadApp-wrap" [ngStyle]="{'backgroundColor':bgColor}">
            <div class="downloadApp-image" [ngStyle]="{'color':circleBgColor}">
                <div class="downloadAppImg-wrap">
                    <img class='downloadApp-thumb thumb-1' *ngIf="thumbImage1" [src]='thumbImage1' [alt]="thumbImageAlt1 && thumbImageAlt1.trim() ? thumbImageAlt1 : '' " height='374' width='184' />
                    <img class='downloadApp-thumb thumb-2' *ngIf="thumbImage2" [src]='thumbImage2' [alt]="thumbImageAlt2 && thumbImageAlt2.trim() ? thumbImageAlt2 : '' " height='374' width='184' />
                </div>
            </div>
            <div class="downloadApp-content">
                <div class="section-description" *ngIf="sectionDescription" [innerHTML]="sectionDescription"></div>
                <div class="downloadAppIcons">
                    <a class='downloadApp-link' target='_blank' [href]="thumbIcon1Url" [attr.aria-label]="thumbIconAlt1 && thumbIconAlt1.trim() ? thumbIconAlt1 : ''">
                        <img class='downloadApp-icon' *ngIf="thumbIcon1" [src]='thumbIcon1' [alt]="thumbIconAlt1 && thumbIconAlt1.trim() ? thumbIconAlt1 : '' " height='81' width='181' />
                    </a>
                    <a class='downloadApp-link' target='_blank' [href]="thumbIcon2Url" [attr.aria-label]="thumbIconAlt2 && thumbIconAlt2.trim() ? thumbIconAlt2 : ''">
                        <img class='downloadApp-icon' *ngIf="thumbIcon2" [src]='thumbIcon2' [alt]="thumbIconAlt2 && thumbIconAlt2.trim() ? thumbIconAlt2 : '' " height='81' width='181' />
                    </a>
                </div>
            </div>
        </div>
    </div>
</section>
