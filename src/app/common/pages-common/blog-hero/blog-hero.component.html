<section class="blog-hero" *ngIf="bgImage || sectionTitle" [ngStyle]="bgImage ? {'background-image': 'url(' + bgImage + ')'} : {}">
    <div class="container">
        <div class="bannerOverlay">
            <h1 class='section-title' *ngIf='sectionTitle'>{{sectionTitle}}</h1>
        </div>
    </div>
</section>
